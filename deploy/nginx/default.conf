# Production nginx for softladylux.com with TLS terminated here (SRS §9: HTTPS only, HSTS).
# Certificates: ./certs/fullchain.pem and ./certs/privkey.pem, issued and renewed by the certbot
# service (Let's Encrypt, HTTP-01 webroot). deploy/deploy.sh issues the first certificate.

server_tokens off;
tcp_nopush on;

# Compression: build-time .gz files first (nitro compressPublicAssets), on-the-fly for the rest.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml
           application/manifest+json image/svg+xml font/ttf font/otf;

open_file_cache max=2000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_errors on;

# Docker's DNS: upstreams are re-resolved at runtime, so a recreated container's new IP is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_up {
  zone backend_up 64k;
  server backend:8000 resolve;
}
upstream frontend_up {
  zone frontend_up 64k;
  server frontend:3000 resolve;
  keepalive 16;
}

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# One Cache-Control per path, set at server level (an add_header inside a location would drop the
# security headers below). Empty = header not added.
map $uri $cache_control {
  ~^/_nuxt/   "public, max-age=31536000, immutable";
  ~^/static/  "public, max-age=2592000, immutable";
  ~^/media/   "public, max-age=2592000";
  ~^/_ipx/    "public, max-age=2592000";
  default     "";
}

# SRS ARC-07 / SD-02: resized WebP copies made by Nuxt Image (IPX/sharp) are cached on disk, so each
# size is computed once. Safe because uploaded originals never change in place.
proxy_cache_path /var/cache/nginx/ipx levels=1:2 keys_zone=ipx:10m max_size=1g inactive=60d use_temp_path=off;

# Port 80: ACME challenges, the cert-free health path (uptime checks, container healthcheck), and a
# redirect to HTTPS for everything else.
server {
  listen 80 default_server;
  server_name _;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
  location = /api/v1/health/ {
    proxy_pass http://backend_up;
    proxy_set_header Host $host;
  }
  location / { return 301 https://$host$request_uri; }
}

# Unknown hosts and bare-IP scanners: refuse the TLS handshake.
server {
  listen 443 ssl default_server;
  ssl_reject_handshake on;
}

# Shared TLS settings for the two named servers.
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# www -> apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.softladylux.com;
  return 301 https://softladylux.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name softladylux.com;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $cache_control;
  add_header X-Cache $upstream_cache_status;

  # Product photos: a form can send several files of up to 5 MB each in one request (WEB-09).
  client_max_body_size 30m;

  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html { root /usr/share/nginx/html; internal; }

  location /api/ {
    proxy_hide_header Strict-Transport-Security;  # Django sends its own; avoid a duplicate header
    proxy_pass http://backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /static/ { alias /static/; }
  # Uploaded originals never change in place; Nuxt Image serves resized WebP copies of them.
  location /media/  { alias /media/; }

  location /_ipx/ {
    proxy_pass http://frontend_up;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache ipx;
    proxy_cache_key $request_uri;
    proxy_cache_valid 200 60d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
  }

  # SRS ARC-03: Nuxt build files are served from disk by nginx; anything not on disk is rendered by Nuxt.
  location /_nuxt/ {
    root /usr/share/nginx/nuxt;
    try_files $uri @frontend;
  }
  location / {
    root /usr/share/nginx/nuxt;
    try_files $uri @frontend;
  }

  location @frontend {
    proxy_pass http://frontend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
