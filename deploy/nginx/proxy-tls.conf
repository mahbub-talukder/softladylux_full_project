# Variant for hosting where a provider's proxy / load balancer terminates TLS and forwards plain HTTP
# to this nginx with X-Forwarded-Proto. Use with docker-compose.proxy-tls.yml. This nginx listens on
# HTTP only; it trusts X-Forwarded-Proto from that proxy (so the proxy MUST set it, and nothing else
# may reach this port directly). Django then sees HTTPS and sets HSTS / secure cookies.
# Static, image-cache and upstream settings match default.conf (SRS ARC-03, ARC-07).

server_tokens off;
tcp_nopush on;

gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml
           application/manifest+json image/svg+xml font/ttf font/otf;

open_file_cache max=2000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_errors on;

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_up {
  zone backend_up 64k;
  server backend:8000 resolve;
}
upstream frontend_up {
  zone frontend_up 64k;
  server frontend:3000 resolve;
  keepalive 16;
}

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
map $http_x_forwarded_proto $sll_proto { default $scheme; https https; }
map $uri $cache_control {
  ~^/_nuxt/   "public, max-age=31536000, immutable";
  ~^/static/  "public, max-age=2592000, immutable";
  ~^/media/   "public, max-age=2592000";
  ~^/_ipx/    "public, max-age=2592000";
  default     "";
}

proxy_cache_path /var/cache/nginx/ipx levels=1:2 keys_zone=ipx:10m max_size=1g inactive=60d use_temp_path=off;

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 30m;

  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html { root /usr/share/nginx/html; internal; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control;
  add_header X-Cache $upstream_cache_status;

  location /api/ {
    proxy_pass http://backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sll_proto;
    proxy_read_timeout 60s;
  }
  location /static/ { alias /static/; }
  location /media/  { alias /media/; }

  location /_ipx/ {
    proxy_pass http://frontend_up;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache ipx;
    proxy_cache_key $request_uri;
    proxy_cache_valid 200 60d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
  }

  location /_nuxt/ { root /usr/share/nginx/nuxt; try_files $uri @frontend; }
  location /       { root /usr/share/nginx/nuxt; try_files $uri @frontend; }

  location @frontend {
    proxy_pass http://frontend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sll_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
