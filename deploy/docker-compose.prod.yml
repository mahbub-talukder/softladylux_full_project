# Production stack. Run from the PROJECT ROOT (parent of backend/ and frontend/):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# db, backend, worker, and backup read backend/.env (copy backend/.env.production.example).
# frontend reads frontend/.env (copy frontend/.env.production.example).
# TLS: Let's Encrypt via the certbot service (first certificate: deploy/deploy.sh, stage issue-cert);
# certbot copies fullchain.pem / privkey.pem into deploy/certs/. Or use docker-compose.proxy-tls.yml
# when a provider's proxy terminates TLS (docs/DEPLOYMENT.md).
# No Redis: Django-Q2 uses PostgreSQL. Only nginx publishes ports.
# Memory limits fit a 2 vCPU / 4 GB server with 2 GB swap (SRS §9 capacity: one server).
name: softladylux-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    container_name: softladylux-prod-db
    image: postgres:16
    env_file: ../backend/.env
    # Tuned for 4 GB RAM shared with the app; 50 connections cover gunicorn + worker + backups.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1GB",
              "-c", "work_mem=8MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=50"]
    mem_limit: 768m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  backend:
    container_name: softladylux-prod-backend
    # One image for backend, worker and backup: built once, never drifts.
    image: softladylux-prod-backend:latest
    build: ../backend
    env_file: ../backend/.env
    mem_limit: 640m
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      retries: 10
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  worker:
    container_name: softladylux-prod-worker
    image: softladylux-prod-backend:latest
    command: python manage.py qcluster
    mem_limit: 384m
    env_file: ../backend/.env
    environment:
      RUN_MIGRATIONS: "0"
    volumes:
      - media:/app/media
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # the slim image has no pgrep: look for the qcluster process in /proc
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any(b'qcluster' in open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 30s
      retries: 3
    logging: *logging
    restart: unless-stopped

  frontend:
    container_name: softladylux-prod-frontend
    image: softladylux-prod-frontend:latest
    build:
      context: ../frontend
      target: prod
    env_file: ../frontend/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 640m
    volumes:
      - media:/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  nginx:
    container_name: softladylux-prod-nginx
    image: softladylux-prod-nginx:latest
    # nginx serves the Nuxt build's static files itself (SRS ARC-03); see nginx/Dockerfile.
    build:
      context: ./nginx
      additional_contexts:
        frontend: service:frontend
    mem_limit: 128m
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
      - ipx_cache:/var/cache/nginx/ipx
      - media:/media:ro
      - static:/static:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health/"]
      interval: 15s
      retries: 5
    logging: *logging
    restart: unless-stopped

  # Optional daily backup (SRS §9: the daily schedule runs --mode all; the newest BACKUP_KEEP are kept).
  # Start with:  docker compose -f deploy/docker-compose.prod.yml --profile backup up -d backup
  # Files land in the `backups` volume: copy it OFF the server regularly (docs/RUNBOOK.md).
  backup:
    container_name: softladylux-prod-backup
    profiles: ["backup"]
    image: softladylux-prod-backend:latest
    mem_limit: 256m
    env_file: ../backend/.env
    entrypoint: []
    command: ["sh", "-c", "while true; do scripts/backup.sh --mode all || echo 'backup FAILED' >&2; sleep 86400; done"]
    volumes:
      - media:/app/media:ro
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  # Let's Encrypt renewal (SRS §9 HTTPS). Checks twice a day; on renewal copies the new pair into
  # deploy/certs, which nginx re-reads on its 6-hourly reload.
  certbot:
    container_name: softladylux-prod-certbot
    image: certbot/certbot:v3.0.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot --deploy-hook 'cp -L \"$$RENEWED_LINEAGE/fullchain.pem\" \"$$RENEWED_LINEAGE/privkey.pem\" /certs/'; sleep 12h & wait $$!; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./certs:/certs
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  backups:
  letsencrypt:
  certbot_www:
  ipx_cache:
