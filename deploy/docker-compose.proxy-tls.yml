# Override for hosting where a provider's proxy / load balancer terminates TLS.
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.proxy-tls.yml up -d --build
# nginx then listens on plain HTTP only and trusts X-Forwarded-Proto from that proxy. Make sure only
# the proxy can reach this port (firewall / private network). The certbot service is not needed here:
# start the stack without it (list the services, or `docker compose ... stop certbot`).
services:
  nginx:
    ports: !override
      - "${HTTP_PORT:-80}:80"
    volumes: !override
      - ./nginx/proxy-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ipx_cache:/var/cache/nginx/ipx
      - media:/media:ro
      - static:/static:ro
